[package]
name = "threat-atlas-core"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Native SOC screensaver displaying public threat-map telemetry"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Updater tests (WP9) only: lets ATLAS_TEST_FEED_PATH / ATLAS_TEST_ROOT pick a test feed and a throwaway
# test root (see update_test_feed.rs). Never enabled by the release build scripts.
test-feed = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tiny-skia = "0.12"
fontdue = "0.9"
sha2 = "0.10"
# Ed25519 feed signature check; same ring that rustls already uses (no new crate).
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
flate2 = "1"
jiff = "1"
